<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colspan y rowspan</title>
</head>
<body>
    <table border="5%">
        <caption>Especialidades</caption>
        <thead>
            <tr>
                <th>Programacion</th>
                <th>Ofimatica</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td colspan="2">HORARIO</td>
            </tr>
        </tbody>
        <tfoot></tfoot>

    </table><br><br><br>


    <table border="1">
        <caption>Especialidades</caption>
        <thead>
            <tr>
                <th>Carreras</th>
                <th>Horario</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Ofimatica</td>
                <td rowspan="3">Receso</td>
            </tr>
            <tr>
                <td>Programacion</td>
            </tr>
            <tr>
                <td>Administracion</td>
            </tr>

        </tbody>

        <tfoot>

        </tfoot>
    </table>
</body>
</html>
